name: WordPress REST API bridge
on:
  workflow_dispatch:
    inputs:
      queue_file:
        description: 'WordPress queue JSON filename (without path)'
        required: true
        default: 'formnext-2026-waam-p3d-ency-20261123.json'
        type: string
  push:
    paths:
      - 'wordpress-queue/*.json'
permissions:
  contents: write
jobs:
  wordpress:
    runs-on: ubuntu-latest
    env:
      WORDPRESS_URL: ${{ vars.WORDPRESS_URL }}
      WORDPRESS_USERNAME: ${{ vars.WORDPRESS_USERNAME }}
      WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish or update WordPress posts and pages
        shell: python
        run: |
          import os, json, base64, urllib.request, urllib.error, pathlib, sys
          from urllib.parse import quote
          url=os.environ.get("WORDPRESS_URL","").rstrip("/")
          user=os.environ.get("WORDPRESS_USERNAME","")
          password=os.environ.get("WORDPRESS_APP_PASSWORD","")
          if not all([url,user,password]): sys.exit("Missing WordPress configuration")
          if not url.startswith("https://"): sys.exit("WordPress URL must use HTTPS")
          token=base64.b64encode(f"{user}:{password}".encode()).decode()
          headers={"Authorization":f"Basic {token}","Accept":"application/json"}
          def request(endpoint, payload=None, binary=None, filename=None):
              h=dict(headers)
              if binary is not None:
                  h["Content-Type"]="image/png" if filename.endswith(".png") else "image/jpeg"
                  h["Content-Disposition"]=f'attachment; filename="{filename}"'
              elif payload is not None:
                  h["Content-Type"]="application/json; charset=utf-8"
              body=binary if binary is not None else (json.dumps(payload).encode("utf-8") if payload is not None else None)
              req=urllib.request.Request(url+"/wp-json/wp/v2/"+endpoint,headers=h,data=body,method="POST" if body is not None else "GET")
              try:
                  with urllib.request.urlopen(req,timeout=40) as resp: return json.load(resp)
              except urllib.error.HTTPError as e:
                  sys.exit(f"WordPress HTTP {e.code}: {e.read(500).decode(errors='replace')}")
          me=request("users/me?context=edit")
          print("WordPress authenticated user:",me.get("id"))
          summary=[]
          files=set()
          if os.environ.get("GITHUB_EVENT_NAME")=="workflow_dispatch":
              queue_file=os.environ.get("GITHUB_EVENT_PATH")
              dispatch=json.load(open(queue_file))
              selected=dispatch.get("inputs",{}).get("queue_file","")
              if not selected or pathlib.PurePath(selected).name!=selected or not selected.endswith(".json"):
                  sys.exit("Invalid queue filename")
              files={"wordpress-queue/"+selected}
              print("Manual run: processing",len(files),"queued WordPress requests")
          else:
              event=json.load(open(os.environ["GITHUB_EVENT_PATH"]))
              for commit in event.get("commits",[]):
                  files.update(commit.get("added",[]))
                  files.update(commit.get("modified",[]))
          for name in sorted(files):
              if not name.startswith("wordpress-queue/") or not name.endswith(".json"): continue
              p=pathlib.Path(name)
              if not p.is_file(): continue
              post=json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(post,dict) or not post.get("title") or not post.get("content"): sys.exit("Missing title or content in "+name)
              kind=post.get("type","post")
              if kind not in ("post","page"): sys.exit("Unsupported content type: "+kind)
              collection="pages" if kind=="page" else "posts"
              status=post.get("status","draft")
              if status not in ("draft","publish"): sys.exit("Invalid post status")
              slug=post.get("slug")
              if not slug: sys.exit("Missing stable slug in "+name)
              matches=request(collection+"?context=edit&status=any&slug="+quote(slug))
              if len(matches)>1: sys.exit("Multiple WordPress posts with slug "+slug)
              if not matches:
                  candidates=request(collection+"?context=edit&status=any&search="+quote(post["title"]))
                  matches=[item for item in candidates if item.get("title",{}).get("raw",item.get("title",{}).get("rendered",""))==post["title"]]
              if len(matches)>1: sys.exit("Multiple posts with matching title; refusing duplicate")
              existing=matches[0] if matches else None
              # Never overwrite a German original when preparing an English page.
              source_id=post.get("translation_of")
              if source_id is not None:
                  if kind!="page" or not isinstance(source_id,int) or source_id<=0: sys.exit("translation_of requires a valid source page ID")
                  source=request("pages/"+str(source_id)+"?context=edit")
                  if source.get("id")!=source_id: sys.exit("Source page not found")
                  if existing and existing["id"]==source_id: sys.exit("Refusing to overwrite original page")
                  if status=="publish" and not post.get("approved_for_publication",False): sys.exit("English page requires explicit publication approval")
              if kind=="page" and existing and post.get("page_id") and existing["id"]!=post["page_id"]: sys.exit("Page ID and slug mismatch")
              payload={"title":post["title"],"content":post["content"],"status":status,"slug":slug}
              if post.get("excerpt"): payload["excerpt"]=post["excerpt"]
              if post.get("image_url") and (not existing or not existing.get("featured_media")):
                  image_url=post["image_url"]
                  if not image_url.startswith("https://"): sys.exit("image_url must use HTTPS")
                  with urllib.request.urlopen(urllib.request.Request(image_url,headers={"User-Agent":"DTR-WordPress-Bridge/1.0"}),timeout=40) as resp:
                      data=resp.read(15000001)
                  if len(data)>15000000: sys.exit("Image exceeds 15MB")
                  if data.startswith(bytes.fromhex("89504e470d0a1a0a")): filename="formnext-waam-impeller.png"
                  elif data.startswith(bytes.fromhex("ffd8ff")): filename="formnext-waam-impeller.jpg"
                  else: sys.exit("Only PNG/JPEG images are supported")
                  media=request("media",binary=data,filename=filename)
                  payload["featured_media"]=media["id"]
              if kind=="post" and post.get("category_slug"):
                  cats=request("categories?slug="+quote(post["category_slug"]))
                  if not cats: sys.exit("WordPress category not found: "+post["category_slug"])
                  payload["categories"]=[cats[0]["id"]]
              endpoint=collection+"/"+str(existing["id"]) if existing else collection
              result=request(endpoint,payload)
              if result.get("status")!=status: sys.exit("Unexpected WordPress status: "+str(result.get("status")))
              link=result.get("link")
              if not link: sys.exit("WordPress returned no article URL")
              print("WordPress", "UPDATED" if existing else "CREATED", status, "ID:",result["id"],"URL:",link)
              summary.append(f"- [{post['title']}]({link}) — {status}, ID {result['id']}")
              report={"title":post["title"],"url":link,"wordpress_id":result["id"],"status":result["status"],"featured_media":result.get("featured_media"),"queue_file":name,"type":kind,"translation_of":source_id}
              report_path="wordpress-results/"+p.stem+".json"
              api="https://api.github.com/repos/"+os.environ["GH_REPO"]+"/contents/"+report_path
              gh_headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,headers=gh_headers),timeout=30) as resp:
                      existing_report=json.load(resp)
                      existing_sha=existing_report.get("sha")
              except urllib.error.HTTPError as e:
                  if e.code!=404: raise
                  existing_sha=None
              write={"message":"Record WordPress publication URL for "+p.stem,"content":base64.b64encode(json.dumps(report,ensure_ascii=False,indent=2).encode()).decode()}
              if existing_sha: write["sha"]=existing_sha
              req=urllib.request.Request(api,data=json.dumps(write).encode(),headers={**gh_headers,"Content-Type":"application/json"},method="PUT")
              with urllib.request.urlopen(req,timeout=30) as resp:
                  print("Saved WordPress publication report:",report_path,resp.status)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## WordPress publication results\n"+("\n".join(summary) if summary else "No queue posts changed")+"\n")
